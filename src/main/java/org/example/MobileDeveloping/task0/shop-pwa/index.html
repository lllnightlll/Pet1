<!DOCTYPE html>
<html lang="ru" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fb6f92">
  <title>Darknet</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preload" href="./parchment.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/vpn-gate.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      font-size: calc(1rem * var(--type-scale));
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-via) 50%, var(--bg-to) 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    button,
    a,
    input {
      font-family: inherit;
    }

    #app-header {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, var(--btn-from) 0%, var(--btn-to) 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--btn-text);
      box-shadow: var(--shadow);
      z-index: 10;
      view-transition-name: app-header;
    }

    #back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      font-size: calc(20px * var(--emoji-scale));
      cursor: pointer;
      color: var(--btn-text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #back-btn:hover { background: rgba(255,255,255,0.3); }

    .hidden { display: none; }

    #back-btn.hidden { display: none; }

    #app-title { font-size: calc(20px * var(--type-scale)); font-weight: 600; }

    #tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      z-index: 20;
      view-transition-name: tabbar;
    }

    .tab-btn {
      background: none;
      border: none;
      font-size: calc(13px * var(--type-scale));
      color: var(--muted);
      cursor: pointer;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
      text-decoration: none;
    }

    .tab-btn .icon { font-size: calc(24px * var(--emoji-scale)); font-family: var(--font-emoji); }
    .tab-btn.active { color: var(--accent); }

    .screen { padding: 16px; }
    .screen h2 { margin-bottom: 16px; color: var(--text); font-size: calc(24px * var(--type-scale)); }

    /* Карточки товаров */
    .product-list { padding: 16px; display: grid; gap: 12px; }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s, border-color 0.3s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .product-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--alt-pink) 0%, var(--alt-rose) 100%);
    }

    .product-card .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .product-card .title { font-weight: 600; font-size: calc(16px * var(--type-scale)); margin-bottom: 4px; }
    .product-card .price { color: var(--accent); font-weight: 700; font-size: calc(18px * var(--type-scale)); }

    /* Детали товара */
    .product-detail {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .product-detail img {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--alt-pink) 0%, var(--alt-rose) 100%);
    }

    .product-detail h3 { font-size: calc(24px * var(--type-scale)); margin-bottom: 8px; color: var(--text); }
    .product-detail .price { font-size: calc(28px * var(--type-scale)); font-weight: 700; color: var(--accent); margin-bottom: 16px; }
    .product-detail .description { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

    .buy-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--btn-from) 0%, var(--btn-to) 100%);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      font-size: calc(16px * var(--type-scale));
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
    }

    .buy-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* Профиль и настройки */
    .profile-card, .settings-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .profile-card h2, .settings-card h2 { color: var(--text); margin-bottom: 16px; }
    .profile-card p, .settings-card p { margin-bottom: 12px; color: var(--muted); font-size: calc(16px * var(--type-scale)); }

    .profile-card .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--btn-from) 0%, var(--btn-to) 100%);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(32px * var(--emoji-scale));
      color: var(--btn-text);
      overflow: hidden;
    }

    .profile-card .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    :root {
      --screen-transition-duration: 300ms;
      --screen-transition-easing: ease-out;
    }

    #app-root {
      view-transition-name: screen;
    }

    @keyframes slide-in-from-right {
      from { transform: translateX(100%); }
    }

    @keyframes slide-out-to-left {
      to { transform: translateX(-100%); }
    }

    @keyframes slide-in-from-left {
      from { transform: translateX(-100%); }
    }

    @keyframes slide-out-to-right {
      to { transform: translateX(100%); }
    }

    ::view-transition-group(screen) {
      overflow: hidden;
    }

    ::view-transition-old(screen) {
      animation: var(--screen-transition-duration) var(--screen-transition-easing) both slide-out-to-left;
    }

    ::view-transition-new(screen) {
      animation: var(--screen-transition-duration) var(--screen-transition-easing) both slide-in-from-right;
      z-index: 1;
    }

    html.back-transition::view-transition-old(screen) {
      animation-name: slide-out-to-right;
    }

    html.back-transition::view-transition-new(screen) {
      animation-name: slide-in-from-left;
    }

    .not-found {
      text-align: center;
      padding: 32px 16px 48px;
    }

    .not-found-card {
      max-width: 22rem;
      margin: 0 auto;
    }

    .not-found-code {
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: calc(12px * var(--type-scale));
      color: var(--muted);
      margin-bottom: 8px;
    }

    .not-found .not-found-okak {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1;
      margin: 8px 0 12px;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .not-found-cat {
      display: block;
      font-size: 2.75rem;
      line-height: 1;
      margin: 0 auto 8px;
      font-family: var(--font-emoji);
    }

    .not-found-hint {
      color: var(--muted);
      font-size: calc(16px * var(--type-scale));
    }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header id="app-header">
    <button id="back-btn" class="hidden" aria-label="Назад">←</button>
    <h1 id="app-title">Darknet</h1>
    <button type="button" class="theme-toggle" aria-label="Переключить тему">☀️</button>
  </header>

  <main id="app-root" style="view-transition-name: screen;">
    <!-- Сюда роутер рендерит текущий экран -->
  </main>

  <nav id="tabbar">
    <button class="tab-btn active" data-href="/">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button type="button" class="tab-btn" data-href="/profile" data-action="open-profile">
      <span class="icon">👤</span>
      <span>Profile</span>
    </button>
    <button class="tab-btn" data-href="/settings">
      <span class="icon">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    class ProductCatalog {
      static PRODUCT_COUNT = 40;
      static PRICE_STEP = 100;
      static IMAGE_SIZE = 200;
      static IMAGE_BG = 'ff8fab';
      static IMAGE_FG = 'ffffff';

      static buildImageUrl(productId) {
        return `https://dummyjson.com/image/${ProductCatalog.IMAGE_SIZE}/${ProductCatalog.IMAGE_BG}/${ProductCatalog.IMAGE_FG}?text=${productId}`;
      }

      static createProduct(index) {
        const id = index + 1;
        return {
          id,
          title: `Product ${id}`,
          price: id * ProductCatalog.PRICE_STEP,
          image: ProductCatalog.buildImageUrl(id),
          description: `Detailed description of product ${id}. The perfect choice for those who value quality and style.`
        };
      }

      static createAll() {
        return Array.from(
          { length: ProductCatalog.PRODUCT_COUNT },
          (_, index) => ProductCatalog.createProduct(index)
        );
      }

      static findById(items, id) {
        return items.find(product => product.id === Number(id));
      }
    }

    const products = ProductCatalog.createAll();
    const getProduct = id => ProductCatalog.findById(products, id);

    /**
     * Открывает профиль из my_pwa_first отдельной страницей, а не экраном магазина.
     */
    class ProfileNavigator {
      static SIBLING_URL = '../my_pwa_first/index.html';
      static ACTION_OPEN_PROFILE = 'open-profile';
      static TAB_SELECTOR = '[data-action="open-profile"]';

      /**
       * Рядом с магазином (file://, /shop-pwa/) — соседняя папка.
       * В Docker/туннеле магазин в корне, профиль лежит в /my_pwa_first/.
       */
      static getTargetUrl() {
        if (window.location.protocol === 'file:') {
          return new URL(ProfileNavigator.SIBLING_URL, window.location.href).href;
        }
        return new URL('/my_pwa_first/', window.location.origin).href;
      }

      static go() {
        window.location.assign(ProfileNavigator.getTargetUrl());
      }

      static bindTab() {
        document.querySelectorAll(ProfileNavigator.TAB_SELECTOR).forEach((tab) => {
          tab.addEventListener('click', (event) => {
            event.preventDefault();
            ProfileNavigator.go();
          });
        });
      }
    }

    class ScreenFactory {
      static home() {
        return `
    <div class="product-list">
      ${products.map(p => `
        <a href="#/product/${p.id}" class="product-card" data-link>
          <img src="${p.image}" alt="${p.title}">
          <div class="info">
            <div class="title">${p.title}</div>
            <div class="price">${p.price} ₽</div>
          </div>
        </a>
      `).join('')}
    </div>
  `;
      }

      static product(params) {
        const p = getProduct(params.id);
        if (!p) return `<div class="screen"><h2>Товар не найден</h2></div>`;
        return `
      <div class="screen">
        <div class="product-detail">
          <img src="${p.image}" alt="${p.title}">
          <h3>${p.title}</h3>
          <div class="price">${p.price} ₽</div>
          <div class="description">${p.description}</div>
          <button class="buy-btn">Купить</button>
        </div>
      </div>
    `;
      }

      static profile() {
        ProfileNavigator.go();
        return '';
      }
    }

    /**
     * Экран 404 в стиле мема «окак»: страница нашлась, но маршрута нет.
     */
    class NotFoundScreen {
      static TITLE = '404';
      static CODE_LABEL = '404 Not Found';
      static MEME_TEXT = 'окак';
      static HINT = 'такой страницы нет';

      static toHtml() {
        return `
      <div class="screen not-found">
        <div class="settings-card not-found-card">
          <p class="not-found-code">${NotFoundScreen.CODE_LABEL}</p>
          <span class="not-found-cat" aria-hidden="true">🐱</span>
          <h2 class="not-found-okak">${NotFoundScreen.MEME_TEXT}</h2>
          <p class="not-found-hint">${NotFoundScreen.HINT}</p>
        </div>
      </div>
    `;
      }
    }

    const screens = {
      home: () => ScreenFactory.home(),
      product: (params) => ScreenFactory.product(params),
      profile: () => ScreenFactory.profile()
    };

    class RouterShell {
      static ROOT_ID = 'app-root';
      static TITLE_ID = 'app-title';
      static BACK_BTN_ID = 'back-btn';
      static TABBAR_ID = 'tabbar';

      static query() {
        return {
          root: document.getElementById(RouterShell.ROOT_ID),
          titleEl: document.getElementById(RouterShell.TITLE_ID),
          backBtn: document.getElementById(RouterShell.BACK_BTN_ID),
          tabbar: document.getElementById(RouterShell.TABBAR_ID)
        };
      }
    }

    class RouteTable {
      static SCREEN_HOME = 'home';
      static SCREEN_PRODUCT = 'product';
      static SCREEN_PROFILE = 'profile';
      static SCREEN_SETTINGS = 'settings';

      static HREF_HOME = '/';
      static HREF_PROFILE = '/profile';
      static HREF_SETTINGS = '/settings';

      static TITLE_PRODUCT = 'Product';
      static TITLE_PROFILE = 'Profile';

      static PATTERN_HOME = /^\/$/;
      static PATTERN_PRODUCT = /^\/product\/(\d+)$/;
      static PATTERN_PROFILE = /^\/profile$/;

      static create(homeTitle) {
        return [
          {
            pattern: RouteTable.PATTERN_HOME,
            name: RouteTable.SCREEN_HOME,
            title: homeTitle
          },
          {
            pattern: RouteTable.PATTERN_PRODUCT,
            name: RouteTable.SCREEN_PRODUCT,
            title: RouteTable.TITLE_PRODUCT
          },
          {
            pattern: RouteTable.PATTERN_PROFILE,
            name: RouteTable.SCREEN_PROFILE,
            title: RouteTable.TITLE_PROFILE
          }
        ];
      }
    }

    class PathMatcher {
      constructor(routeList) {
        this.routeList = routeList;
      }

      match(path) {
        for (const route of this.routeList) {
          const m = path.match(route.pattern);
          if (m) return { route, params: { id: m[1] } };
        }
        return null;
      }
    }

    const { root, titleEl, backBtn, tabbar } = RouterShell.query();

    const routes = RouteTable.create(titleEl.textContent.trim());
    const pathMatcher = new PathMatcher(routes);

    function match(path) {
      return pathMatcher.match(path);
    }

    /**
     * Путь приложения живёт в hash (#/product/5), чтобы браузер
     * не ходил за несуществующими файлами /product/5 и /settings.
     */
    class AppLocation {
      static STATE_KEY = 'path';

      static normalize(path) {
        if (!path) return RouteTable.HREF_HOME;
        const withoutHash = String(path).replace(/^#/, '');
        if (!withoutHash || withoutHash === '/') return RouteTable.HREF_HOME;
        return withoutHash.startsWith('/') ? withoutHash : `/${withoutHash}`;
      }

      static toHash(path) {
        return `#${AppLocation.normalize(path)}`;
      }

      static fromUrl(url) {
        const hashPath = AppLocation.normalize(url.hash);
        if (url.hash && hashPath) return hashPath;
        if (match(url.pathname)) return url.pathname;
        return AppLocation.normalize(url.pathname);
      }

      static fromBrowser() {
        if (history.state && history.state[AppLocation.STATE_KEY]) {
          return AppLocation.normalize(history.state[AppLocation.STATE_KEY]);
        }
        if (location.hash) {
          return AppLocation.normalize(location.hash);
        }
        return RouteTable.HREF_HOME;
      }

      static commit(path) {
        const normalized = AppLocation.normalize(path);
        const nextHash = AppLocation.toHash(normalized);
        const state = { [AppLocation.STATE_KEY]: normalized };
        if (location.hash === nextHash) {
          history.replaceState(state, '', nextHash);
        } else {
          history.pushState(state, '', nextHash);
        }
        return normalized;
      }
    }

    class AppRouter {
      static SCROLL_KEY_PREFIX = 'scroll:';
      static TAB_BUTTON_SELECTOR = '.tab-btn';
      static CLASS_ACTIVE = 'active';
      static CLASS_HIDDEN = 'hidden';

      constructor(deps) {
        this.root = deps.root;
        this.titleEl = deps.titleEl;
        this.backBtn = deps.backBtn;
        this.tabbar = deps.tabbar;
        this.screens = deps.screens;
      }

      getScrollKey(path) {
        return AppRouter.SCROLL_KEY_PREFIX + path;
      }

      restoreScroll(path) {
        const saved = sessionStorage.getItem(this.getScrollKey(path));
        if (saved) {
          window.scrollTo(0, Number(saved));
        } else {
          window.scrollTo(0, 0);
        }
      }

      saveScroll() {
        const path = AppLocation.fromBrowser();
        sessionStorage.setItem(this.getScrollKey(path), String(window.scrollY));
      }

      updateActiveTab(path, routeName) {
        const isHome = routeName === RouteTable.SCREEN_HOME;
        const isProfile = routeName === RouteTable.SCREEN_PROFILE;
        const isSettings = path === RouteTable.HREF_SETTINGS;

        this.tabbar.querySelectorAll(AppRouter.TAB_BUTTON_SELECTOR).forEach((btn) => {
          btn.classList.toggle(
            AppRouter.CLASS_ACTIVE,
            (btn.dataset.href === RouteTable.HREF_HOME && isHome) ||
            (btn.dataset.href === RouteTable.HREF_PROFILE && isProfile) ||
            (btn.dataset.href === RouteTable.HREF_SETTINGS && isSettings)
          );
        });
      }

      paint(found, path) {
        const { route, params } = found;
        this.root.innerHTML = this.screens[route.name](params);
        this.titleEl.textContent = route.title;
        this.backBtn.classList.toggle(
          AppRouter.CLASS_HIDDEN,
          route.name === RouteTable.SCREEN_HOME
        );
        this.updateActiveTab(path, route.name);
      }

      paintNotFound(path) {
        this.root.innerHTML = NotFoundScreen.toHtml();
        this.titleEl.textContent = NotFoundScreen.TITLE;
        this.backBtn.classList.remove(AppRouter.CLASS_HIDDEN);
        this.updateActiveTab(path, null);
      }

      render(path) {
        const found = match(path);
        const doRender = () => {
          if (!found) {
            this.paintNotFound(path);
            return;
          }
          this.paint(found, path);
        };

        if (document.startViewTransition) {
          const transition = document.startViewTransition(doRender);
          transition.finished.then(() => {
            this.restoreScroll(path);
          });
        } else {
          doRender();
          this.restoreScroll(path);
        }
      }
    }

    const appRouter = new AppRouter({
      root,
      titleEl,
      backBtn,
      tabbar,
      screens
    });

    function render(path) {
      appRouter.render(path);
    }

    function restoreScroll(path) {
      appRouter.restoreScroll(path);
    }

    function saveScroll() {
      appRouter.saveScroll();
    }

    class NavigationApiBinder {
      static EVENT_NAVIGATE = 'navigate';

      static isSupported() {
        return Boolean(window.navigation);
      }

      static isExternalProfile(url) {
        const profileUrl = new URL(ProfileNavigator.getTargetUrl());
        return url.pathname === profileUrl.pathname;
      }

      static shouldIntercept(event) {
        const url = new URL(event.destination.url);
        if (url.origin !== location.origin) return false;
        if (!event.canIntercept) return false;
        if (event.downloadRequest !== null) return false;
        if (NavigationApiBinder.isExternalProfile(url)) return false;
        return true;
      }

      static bind(onNavigate) {
        if (!NavigationApiBinder.isSupported()) return;

        window.navigation.addEventListener(NavigationApiBinder.EVENT_NAVIGATE, (event) => {
          if (!NavigationApiBinder.shouldIntercept(event)) return;

          const url = new URL(event.destination.url);
          const path = AppLocation.fromUrl(url);

          event.intercept({
            handler() {
              onNavigate(path);
            }
          });
        });
      }
    }
    NavigationApiBinder.bind(render);

    class AppInteractionBinder {
      static EVENT_CLICK = 'click';
      static EVENT_POPSTATE = 'popstate';
      static TAB_BUTTON_SELECTOR = '.tab-btn';
      static INTERNAL_LINK_SELECTOR = 'a[data-link]';
      static CLASS_BACK_TRANSITION = 'back-transition';

      static markForward() {
        document.documentElement.classList.remove(AppInteractionBinder.CLASS_BACK_TRANSITION);
      }

      static markBack() {
        document.documentElement.classList.add(AppInteractionBinder.CLASS_BACK_TRANSITION);
      }

      static goTo(href) {
        AppInteractionBinder.markForward();
        const path = AppLocation.commit(href);
        render(path);
      }

      static goBack() {
        AppInteractionBinder.markBack();
        history.back();
      }

      static resolveInitialPath() {
        return AppLocation.fromBrowser();
      }

      static bind() {
        backBtn.addEventListener(AppInteractionBinder.EVENT_CLICK, () => {
          saveScroll();
          AppInteractionBinder.goBack();
        });

        tabbar.addEventListener(AppInteractionBinder.EVENT_CLICK, (e) => {
          const btn = e.target.closest(AppInteractionBinder.TAB_BUTTON_SELECTOR);
          if (!btn) return;

          saveScroll();

          if (btn.dataset.action === ProfileNavigator.ACTION_OPEN_PROFILE) {
            return;
          }

          const href = btn.dataset.href;
          AppInteractionBinder.goTo(href);
        });

        document.addEventListener(AppInteractionBinder.EVENT_CLICK, (e) => {
          const link = e.target.closest(AppInteractionBinder.INTERNAL_LINK_SELECTOR);
          if (!link) return;
          e.preventDefault();
          saveScroll();
          const href = link.getAttribute('href');
          AppInteractionBinder.goTo(href);
        });

        window.addEventListener(AppInteractionBinder.EVENT_POPSTATE, () => {
          render(AppLocation.fromBrowser());
        });

        const initialPath = AppInteractionBinder.resolveInitialPath();
        history.replaceState(
          { [AppLocation.STATE_KEY]: initialPath },
          '',
          AppLocation.toHash(initialPath)
        );
        render(initialPath);
      }
    }

    AppInteractionBinder.bind();
    ProfileNavigator.bindTab();
  </script>
  <script>
    class ThemeController {
      static STORAGE_KEY = 'theme';
      static THEME_LIGHT = 'light';
      static THEME_DARK = 'dark';
      static SELECTOR_TOGGLE = '.theme-toggle';
      static ICON_LIGHT = '☀️';
      static ICON_DARK = '🌙';

      constructor() {
        this.root = document.documentElement;
        this.toggleButton = document.querySelector(ThemeController.SELECTOR_TOGGLE);
      }

      isDark() {
        return this.root.classList.contains(ThemeController.THEME_DARK);
      }

      applyTheme(themeName) {
        const isDark = themeName === ThemeController.THEME_DARK;
        this.root.classList.toggle(ThemeController.THEME_DARK, isDark);
        this.root.classList.toggle(ThemeController.THEME_LIGHT, !isDark);
        localStorage.setItem(ThemeController.STORAGE_KEY, themeName);
        this.updateIcon();
      }

      updateIcon() {
        if (!this.toggleButton) return;
        this.toggleButton.textContent = this.isDark()
          ? ThemeController.ICON_DARK
          : ThemeController.ICON_LIGHT;
      }

      toggle() {
        const nextTheme = this.isDark()
          ? ThemeController.THEME_LIGHT
          : ThemeController.THEME_DARK;
        this.applyTheme(nextTheme);
      }

      init() {
        const saved = localStorage.getItem(ThemeController.STORAGE_KEY);
        const initialTheme = saved === ThemeController.THEME_DARK
          ? ThemeController.THEME_DARK
          : ThemeController.THEME_LIGHT;
        this.applyTheme(initialTheme);

        if (this.toggleButton) {
          this.toggleButton.addEventListener('click', () => this.toggle());
        }
      }
    }

    const themeController = new ThemeController();
    themeController.init();
  </script>
  <script src="./js/navigator-sw.js"></script>
</body>

</html>
