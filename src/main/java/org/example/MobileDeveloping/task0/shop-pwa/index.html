<!DOCTYPE html>
<html lang="ru" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fb6f92">
  <title>Darknet</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preload" href="./parchment.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/vpn-gate.js"></script>
</head>

<body>
  <header id="app-header">
    <button id="back-btn" class="hidden" aria-label="Назад">←</button>
    <div class="header-copy">
      <h1 id="app-title" class="visually-hidden">Darknet</h1>
      <p id="app-breadcrumbs" class="breadcrumbs" aria-live="polite">Darknet</p>
    </div>
    <button type="button" class="theme-toggle" aria-label="Переключить тему">☀️</button>
  </header>

  <main id="app-root">
    <!-- Сюда роутер рендерит текущий экран -->
  </main>

  <nav id="tabbar">
    <button class="tab-btn active" data-href="/">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button type="button" class="tab-btn" data-href="/favorites">
      <span class="icon">❤️</span>
      <span>Favorites</span>
    </button>
    <button type="button" class="tab-btn" data-href="/profile" data-action="open-profile">
      <span class="icon">👤</span>
      <span>Profile</span>
    </button>
    <button class="tab-btn" data-href="/settings">
      <span class="icon">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>

  <script src="./js/product-catalog.js"></script>
  <script src="./js/favorites-store.js"></script>
  <script src="./js/profile-navigator.js"></script>
  <script src="./js/not-found-screen.js"></script>
  <script src="./js/screen-factory.js"></script>
  <script src="./js/router-shell.js"></script>
  <script src="./js/route-table.js"></script>
  <script src="./js/breadcrumb-trail.js"></script>
  <script src="./js/path-matcher.js"></script>
  <script src="./js/app-location.js"></script>
  <script src="./js/app-router.js"></script>
  <script src="./js/navigation-api-binder.js"></script>
  <script src="./js/app-interaction-binder.js"></script>
  <script src="./js/theme-controller.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/navigator-sw.js"></script>
</body>

</html>
