<!DOCTYPE html>
<html lang="ru" class="light">

<head>
  <meta charset="UTF-8">
  <script>
    (function setAssetBase() {
      const href = location.protocol === 'file:' ? './' : '/my_pwa_first/';
      document.write('<base href="' + href + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fucking Mobile Development</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preload" href="./parchment.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <button type="button" id="back-btn" class="back-btn" aria-label="Назад">←</button>
  <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Переключить тему">☀️</button>

  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-avatar">
        <img src="./avatar.png" alt="avatar">
      </div>
      <div class="profile-info">
        <h2 class="profile-name">llnightlll</h2>
        <p class="profile-status">FullStack-Developer</p>
      </div>
    </div>

    <div class="profile-stats">
      <div class="profile-stat">
        <span class="profile-stat-value">209</span>
        <span class="profile-stat-label">Commits</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-value">8</span>
        <span class="profile-stat-label">Repos</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-value" data-stat="followers"></span>
        <span class="profile-stat-label">followers</span>
      </div>
    </div>

    <button type="button" class="profile-button" onclick="toggleFollow()">Подписаться</button>
  </div>

  <script src="./js/theme.js"></script>
  <script src="./js/follow.js"></script>
  <script src="./js/back.js"></script>
  <script>
    /**
     * Запасной обработчик, если back.js не загрузился с неверного пути.
     */
    (function bindBackFallback() {
      const button = document.getElementById('back-btn');
      if (!button || button.dataset.bound === 'true') return;
      button.addEventListener('click', function () {
        const shopUrl = location.protocol === 'file:'
          ? new URL('../shop-pwa/index.html', location.href).href
          : new URL('/index.html', location.origin).href;
        location.assign(shopUrl);
      });
    })();
  </script>
  <script src="./js/navigator-sw.js"></script>
</body>

</html>
