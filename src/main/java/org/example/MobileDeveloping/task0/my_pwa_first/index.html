<!DOCTYPE html>
<html lang="ru" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fucking Mobile Development</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap"
    rel="stylesheet">
  <link rel="preload" href="./parchment.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Переключить тему">☀️</button>

  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-avatar">
        <img src="./avatar.png" alt="avatar">
      </div>
      <div class="profile-info">
        <h2 class="profile-name">llnightlll</h2>
        <p class="profile-status">FullStack-Developer</p>
      </div>
    </div>

    <div class="profile-stats">
      <div class="profile-stat">
        <span class="profile-stat-value">209</span>
        <span class="profile-stat-label">Commits</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-value">8</span>
        <span class="profile-stat-label" >Repos</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-value" data-stat="followers"></span>
        <span class="profile-stat-label">followers</span>
      </div>
    </div>

    <button type="button" class="profile-button" onclick="toggleFollow()">Подписаться</button>
  </div>

  <script src="./js/theme.js"></script>
  <script src="./js/follow.js"></script>
  <script src="./js/navigator-sw.js"></script>
</body>

</html>
