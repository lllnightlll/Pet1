<!DOCTYPE html>
<html lang="ru" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fucking Mobile Development</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="preload" href="./parchment.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Remake theme">☀️</button>

  <div class="product-card">
    <div class="product-header">
      <div class="product-image">🌿</div>
      <div>
        <div class="product-title">Weed</div>

    </div>
    <div class="product-footer">
      <div class="product-price">$10 000</div>
      <button class="product-button">Buy now</button>
    </div>
  </div>

  <fieldset class="vendor-box">
    <legend>vendor</legend>
    <img class="vendor-photo" src="./image.png" alt="vendor">
  </fieldset>

  <script src="./js/theme.js"></script>
  <script src="./js/navigator-sw.js"></script>

</html>
